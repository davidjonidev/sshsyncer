version: 2

project_name: sshsyncer

before:
  hooks:
    - go mod tidy

builds:
  - id: sshsyncer
    main: .
    binary: sshsyncer
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: sshsyncer
    repository:
      owner: davidjonidev
      name: homebrew-tap
    homepage: https://github.com/davidjonidev/sshsyncer
    description: Deploy a git branch to a remote server via rsync over SSH, with credentials in 1Password.
    license: MIT
    test: |
      system "#{bin}/sshsyncer --version"
    dependencies:
      - name: rsync
      - name: git
